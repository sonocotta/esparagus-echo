name: Build ESPHome Configs

on:
  push:
    branches:
      - main
    paths:
      - 'firmware/esphome/**'
      - '.github/workflows/build-esphome.yml'
      - '!firmware/esphome/archive/**'
      - '!firmware/esphome/packages-archive/**'
  pull_request:
    paths:
      - 'firmware/esphome/**'
      - '.github/workflows/build-esphome.yml'
      - '!firmware/esphome/archive/**'
      - '!firmware/esphome/packages-archive/**'

jobs:
  prepare:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    outputs:
      configs: ${{ steps.find-configs.outputs.configs }}
    steps:
      - uses: actions/checkout@v3

      - name: Find ESPHome configs
        id: find-configs
        run: |
          configs=$(find firmware/esphome -maxdepth 2 -name "*.yaml" -type f \
            | grep -v "/packages/" \
            | grep -v "/archive/" \
            | grep -v "/packages-archive/" \
            | grep -v "/secrets/" \
            | grep -v "secrets.yaml" \
            | jq -R -s -c 'split("\n")[:-1]')
          echo "configs=$configs" >> $GITHUB_OUTPUT
          echo "Found configs:"
          echo "$configs" | jq -r '.[]'

  build:
    name: Build ${{ matrix.config }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.prepare.outputs.configs) }}
    steps:
      - uses: actions/checkout@v3

      - name: Point this repo's packages at the branch under test
        # The board configs pull firmware/esphome/packages/** back out of this
        # repo over the network (`url:` + `ref: main`), so by default a PR compiles
        # against the *released* packages on main: a package change goes untested
        # until it has merged, and a config using a new package fails outright.
        # On a push to main BRANCH is "main", so this is a no-op.
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ "$BRANCH" = "main" ]; then
            echo "Building main - packages already resolve to main, nothing to do."
            exit 0
          fi
          if [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "::notice::PR from fork $HEAD_REPO - leaving packages on main," \
                 "its branch is not fetchable from origin."
            exit 0
          fi

          # Rewrite only the `ref:` that belongs to a package pulled from THIS
          # repo: `n` steps onto the line after a matching `url:`, which is always
          # that package's `ref:`. Packages from sibling repos such as
          # sonocotta/esparagus-media-center (this branch does not exist there)
          # and commented-out package blocks are deliberately left alone. `-type f`
          # skips secrets.yaml symlinks, which `sed -i` would replace with real files.
          find firmware/esphome -name '*.yaml' -type f -not -path '*/.*' -print0 |
            xargs -0r sed -i \
            "\\|url: https://github.com/${THIS_REPO}\$|{n;s|^\\([[:space:]]*\\)ref: main\$|\\1ref: ${BRANCH}|;}"

          echo "--- package refs now resolving to ---"
          REFS=$(grep -rh -A1 "url: https://github.com/${THIS_REPO}\$" \
            firmware/esphome --include='*.yaml' --exclude-dir='.*' |
            grep -o "ref: .*" || true)
          printf '%s\n' "$REFS" | sort | uniq -c

          # A rename of this repo would leave the package URLs above pointing at
          # its old name, the rewrite would match nothing, and the build would
          # quietly fall back to main's packages. Say so instead.
          if ! printf '%s\n' "$REFS" | grep -q "ref: ${BRANCH}\$"; then
            echo "::warning::No package ref was repointed to ${BRANCH}. This build" \
                 "resolves packages from main and is NOT testing this branch's packages."
          fi

      - name: Get config directory and filename
        id: config-info
        run: |
          config_dir=$(dirname "${{ matrix.config }}")
          config_file=$(basename "${{ matrix.config }}")
          echo "config_dir=$config_dir" >> $GITHUB_OUTPUT
          echo "config_file=$config_file" >> $GITHUB_OUTPUT
          echo "Building: $config_file from $config_dir"

      - name: Cache ESPHome build
        uses: actions/cache@v3
        with:
          path: .esphome-cache
          key: esphome-${{ hashFiles('firmware/esphome/packages/**') }}-${{ matrix.config }}
          restore-keys: |
            esphome-${{ hashFiles('firmware/esphome/packages/**') }}-
            esphome-

      - name: Copy secrets example file for CI build
        run: |
          cp firmware/esphome/secrets.yaml.example \
             "${{ steps.config-info.outputs.config_dir }}/secrets.yaml"

      - name: Build ESPHome config
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/${{ steps.config-info.outputs.config_dir }}:/config" \
            -v "${{ github.workspace }}/firmware/esphome/packages:/config/packages" \
            -v "${{ github.workspace }}/.esphome-cache:/cache" \
            -e PLATFORMIO_BUILD_CACHE_DIR=/cache/.pio-cache \
            esphome/esphome:latest \
            compile "/config/${{ steps.config-info.outputs.config_file }}"